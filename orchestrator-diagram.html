<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HybridSync — Orchestrator Architecture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      padding: 18px 28px 10px;
      gap: 12px;
    }

    .header { text-align: center; flex-shrink: 0; }
    .header h1 {
      font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg, #58a6ff, #a5d6ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -0.5px; margin-bottom: 3px;
    }
    .header p { font-size: 0.8rem; color: #8b949e; }

    .diagram-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    svg { display: block; }
    svg text { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body>

<div class="header">
  <h1>🧠 Orchestrator Architecture</h1>
  <p>Claude Opus · ReAct Loop · Triggered on today's status changes only</p>
</div>

<div class="diagram-wrap">
<svg viewBox="0 0 960 520" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" fill-opacity="0.7"/>
  </marker>
  <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ff7b72" fill-opacity="0.7"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#56d364" fill-opacity="0.8"/>
  </marker>
  <marker id="arr-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#e3b341" fill-opacity="0.8"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#d091cb" fill-opacity="0.8"/>
  </marker>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="glow-sm">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <linearGradient id="g-orch" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1f6feb"/>
    <stop offset="100%" stop-color="#388bfd"/>
  </linearGradient>
  <linearGradient id="g-react" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d2137"/>
    <stop offset="100%" stop-color="#0a1929"/>
  </linearGradient>
</defs>

<!-- ══════════════════════════════════════════════════════
     TRIGGER SOURCES (top)
══════════════════════════════════════════════════════ -->

<!-- Channel Message trigger -->
<rect x="60" y="18" width="168" height="48" rx="8" fill="#9c4d9118" stroke="#9c4d9166" stroke-width="1.2"/>
<text x="144" y="37" text-anchor="middle" fill="#d091cb" font-size="10" font-weight="700">📢 Channel Message</text>
<text x="144" y="51" text-anchor="middle" fill="#8b949e" font-size="8.5">User posts "wfh today"</text>
<text x="144" y="62" text-anchor="middle" fill="#8b949e" font-size="8">stream.js · Haiku classifies</text>

<!-- Chatbot trigger -->
<rect x="732" y="18" width="168" height="48" rx="8" fill="#9c4d9118" stroke="#9c4d9166" stroke-width="1.2"/>
<text x="816" y="37" text-anchor="middle" fill="#d091cb" font-size="10" font-weight="700">💬 DM Chatbot</text>
<text x="816" y="51" text-anchor="middle" fill="#8b949e" font-size="8.5">User asks bot to set status</text>
<text x="816" y="62" text-anchor="middle" fill="#8b949e" font-size="8">chatbot.js · Opus agent</text>

<!-- Arrow from triggers to condition -->
<line x1="228" y1="42" x2="340" y2="100" stroke="#9c4d9155" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
<line x1="732" y1="42" x2="620" y2="100" stroke="#9c4d9155" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>

<!-- ══════════════════════════════════════════════════════
     CONDITION: today only
══════════════════════════════════════════════════════ -->
<rect x="340" y="86" width="280" height="38" rx="8" fill="#1a1200" stroke="#d2992266" stroke-width="1.2"/>
<text x="480" y="102" text-anchor="middle" fill="#e3b341" font-size="10" font-weight="700">⚡ Status Changed for Today?</text>
<text x="480" y="116" text-anchor="middle" fill="#8b949e" font-size="8">Orchestrator only fires for date === todayKey()</text>

<!-- YES arrow down -->
<line x1="480" y1="124" x2="480" y2="152" stroke="#58a6ff88" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="490" y="141" fill="#56d364" font-size="8.5" font-weight="600">YES</text>

<!-- NO arrow right (to notifyDependents) -->
<line x1="620" y1="105" x2="720" y2="105" stroke="#ff7b7266" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
<text x="666" y="99" fill="#ff7b72" font-size="8" text-anchor="middle">NO → future date</text>
<rect x="720" y="88" width="148" height="34" rx="6" fill="#ff7b7210" stroke="#ff7b7244" stroke-width="1"/>
<text x="794" y="103" text-anchor="middle" fill="#ff7b72" font-size="9" font-weight="600">notifyDependents()</text>
<text x="794" y="116" text-anchor="middle" fill="#8b949e" font-size="7.5">Direct DM, no AI</text>

<!-- ══════════════════════════════════════════════════════
     ORCHESTRATOR ENTRY
══════════════════════════════════════════════════════ -->
<rect x="330" y="152" width="300" height="50" rx="10" fill="url(#g-orch)" stroke="#388bfd" stroke-width="1.5" filter="url(#glow-sm)"/>
<text x="480" y="172" text-anchor="middle" fill="white" font-size="12" font-weight="700">🎯 Orchestrator · run()</text>
<text x="480" y="188" text-anchor="middle" fill="#a5d6ff" font-size="8.5">triggeringUserId · date · newStatus · slackClient</text>
<text x="480" y="198" text-anchor="middle" fill="#79c0ff" font-size="7.5">claude-opus-4-7 · adaptive thinking · max 8 iterations</text>

<line x1="480" y1="202" x2="480" y2="226" stroke="#58a6ff88" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════════
     REACT LOOP BOX
══════════════════════════════════════════════════════ -->
<rect x="100" y="226" width="760" height="198" rx="12" fill="url(#g-react)" stroke="#1f6feb55" stroke-width="1.5"/>
<text x="200" y="246" fill="#1f6feb88" font-size="9" font-weight="600" letter-spacing="0.1em">ReAct LOOP — up to 8 iterations</text>

<!-- THINK node -->
<rect x="170" y="256" width="140" height="52" rx="8" fill="#0d2137" stroke="#58a6ff" stroke-width="1.3"/>
<text x="240" y="277" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="700">💭 Think</text>
<text x="240" y="292" text-anchor="middle" fill="#8b949e" font-size="8">Claude reasons about</text>
<text x="240" y="303" text-anchor="middle" fill="#8b949e" font-size="8">what action to take</text>

<!-- THINK → ACT -->
<line x1="310" y1="282" x2="368" y2="282" stroke="#58a6ff88" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- ACT node -->
<rect x="368" y="256" width="140" height="52" rx="8" fill="#0d2137" stroke="#58a6ff" stroke-width="1.3"/>
<text x="438" y="277" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="700">⚡ Act</text>
<text x="438" y="292" text-anchor="middle" fill="#8b949e" font-size="8">Calls one of the</text>
<text x="438" y="303" text-anchor="middle" fill="#8b949e" font-size="8">two tools below</text>

<!-- ACT → OBSERVE -->
<line x1="508" y1="282" x2="566" y2="282" stroke="#58a6ff88" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- OBSERVE node -->
<rect x="566" y="256" width="140" height="52" rx="8" fill="#0d2137" stroke="#58a6ff" stroke-width="1.3"/>
<text x="636" y="277" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="700">👁 Observe</text>
<text x="636" y="292" text-anchor="middle" fill="#8b949e" font-size="8">Reads tool result</text>
<text x="636" y="303" text-anchor="middle" fill="#8b949e" font-size="8">feeds back to Claude</text>

<!-- OBSERVE → back to THINK (curved arrow under) -->
<path d="M636,308 Q480,350 240,308" stroke="#58a6ff55" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="480" y="348" text-anchor="middle" fill="#58a6ff66" font-size="8">loop until done or 8 iterations</text>

<!-- STOP condition -->
<rect x="730" y="256" width="110" height="52" rx="8" fill="#56d36415" stroke="#56d36455" stroke-width="1.2"/>
<text x="785" y="275" text-anchor="middle" fill="#56d364" font-size="10" font-weight="700">✅ Stop</text>
<text x="785" y="289" text-anchor="middle" fill="#8b949e" font-size="8">stop_reason</text>
<text x="785" y="300" text-anchor="middle" fill="#8b949e" font-size="8">= end_turn</text>
<line x1="706" y1="282" x2="730" y2="282" stroke="#56d36488" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
<text x="718" y="276" fill="#56d364" font-size="7.5" text-anchor="middle">done</text>

<!-- ── TOOL 1 ── -->
<rect x="128" y="330" width="210" height="78" rx="8" fill="#d2992215" stroke="#d29922" stroke-width="1.2"/>
<text x="233" y="349" text-anchor="middle" fill="#e3b341" font-size="9.5" font-weight="700">🔍 get_dependency_graph</text>
<text x="233" y="363" text-anchor="middle" fill="#8b949e" font-size="8">input: userId (string)</text>
<text x="233" y="376" text-anchor="middle" fill="#8b949e" font-size="8">→ queries Supabase dependencies table</text>
<text x="233" y="389" text-anchor="middle" fill="#8b949e" font-size="8">output: [{peerId, score}]</text>
<text x="233" y="401" text-anchor="middle" fill="#e3b34188" font-size="7.5">Claude filters: only score ≥ 7</text>

<!-- Tool 1 connector -->
<line x1="240" y1="308" x2="233" y2="330" stroke="#d2992266" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-gold)"/>

<!-- ── TOOL 2 ── -->
<rect x="388" y="330" width="230" height="78" rx="8" fill="#9c4d9115" stroke="#9c4d91" stroke-width="1.2"/>
<text x="503" y="349" text-anchor="middle" fill="#d091cb" font-size="9.5" font-weight="700">📨 send_negotiation_dm</text>
<text x="503" y="363" text-anchor="middle" fill="#8b949e" font-size="8">input: triggeringUserId · peerId · date</text>
<text x="503" y="376" text-anchor="middle" fill="#8b949e" font-size="8">newStatus · score</text>
<text x="503" y="389" text-anchor="middle" fill="#8b949e" font-size="8">→ validates ID · checks peer status</text>
<text x="503" y="401" text-anchor="middle" fill="#9c4d9188" font-size="7.5">skips if peer already has same status</text>

<!-- Tool 2 connector -->
<line x1="438" y1="308" x2="460" y2="330" stroke="#9c4d9166" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-purple)"/>

<!-- ══════════════════════════════════════════════════════
     OUTPUT — Negotiation DM
══════════════════════════════════════════════════════ -->

<!-- Arrow from tool 2 down -->
<line x1="503" y1="408" x2="503" y2="432" stroke="#9c4d9166" stroke-width="1.2" marker-end="url(#arr-purple)"/>

<!-- DM preview box -->
<rect x="348" y="432" width="300" height="76" rx="8" fill="#1c1026" stroke="#9c4d9166" stroke-width="1.2"/>
<text x="448" y="450" fill="#9c4d91" font-size="8" font-weight="600">📨 Slack DM to collaborator:</text>
<rect x="360" y="456" width="276" height="44" rx="5" fill="#2a1a3a"/>
<text x="372" y="471" fill="#e6edf3" font-size="8.5">Deepak switched to WFH 🏠 on 2026-05-19</text>
<text x="372" y="483" fill="#8b949e" font-size="8">Collaboration score: 9/10</text>
<rect x="372" y="488" width="70" height="10" rx="3" fill="#1f6feb"/>
<text x="407" y="497" fill="white" font-size="7" text-anchor="middle">🏠 Switch WFH</text>
<rect x="452" y="488" width="70" height="10" rx="3" fill="#30363d"/>
<text x="487" y="497" fill="#e6edf3" font-size="7" text-anchor="middle">🏢 Stay Office</text>

<!-- ══════════════════════════════════════════════════════
     FAILURE FALLBACK
══════════════════════════════════════════════════════ -->

<!-- Failure arrow from orchestrator box -->
<line x1="330" y1="177" x2="220" y2="177" stroke="#ff7b7255" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="220" y1="177" x2="220" y2="460" stroke="#ff7b7255" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="220" y1="460" x2="250" y2="460" stroke="#ff7b7255" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
<text x="172" y="290" fill="#ff7b7266" font-size="8" text-anchor="middle" transform="rotate(-90,172,310)">AI failure fallback</text>

<rect x="250" y="442" width="88" height="36" rx="6" fill="#ff7b7210" stroke="#ff7b7244" stroke-width="1"/>
<text x="294" y="457" text-anchor="middle" fill="#ff7b72" font-size="8" font-weight="600">notifyDependents</text>
<text x="294" y="469" text-anchor="middle" fill="#8b949e" font-size="7.5">direct fallback</text>

<!-- ══════════════════════════════════════════════════════
     SYSTEM PROMPT CALLOUT
══════════════════════════════════════════════════════ -->
<rect x="624" y="432" width="286" height="76" rx="8" fill="#0d2137" stroke="#1f6feb44" stroke-width="1.2"/>
<text x="767" y="449" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="700">📋 System Prompt Constraints</text>
<text x="634" y="463" fill="#8b949e" font-size="8">› Only act on collaborators with score ≥ 7</text>
<text x="634" y="476" fill="#8b949e" font-size="8">› Never silently change anyone's schedule</text>
<text x="634" y="489" fill="#8b949e" font-size="8">› Stop when all necessary actions are done</text>
<text x="634" y="502" fill="#8b949e" font-size="8">› Prompt-cached · adaptive thinking enabled</text>

</svg>
</div>

</body>
</html>
